<h2>South African economic data, in one dashboard</h2>
<p>SA Economic Pulse brings together more than 40,000 official series from Statistics South Africa and the South African Reserve Bank: GDP and its drivers, consumer and producer inflation, unemployment and wages, interest rates, the rand, bond yields, money and credit, the balance of payments, public finance, mining, manufacturing, retail, property, tourism and company finances.</p>
<p>It needs JavaScript to draw the charts. Created by Preneshen Naicker. Data &copy; Statistics South Africa and the South African Reserve Bank; this is an independent viewer, not affiliated with or endorsed by either.</p>
</section>
